<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Workshop</title>
<link rel="icon" href="../icons/favicon.png">
<style>
  :root {
    --bg: #f4f2ec; --panel: #fffdf8; --line: #ddd8cc; --ink: #2f2d29; --dim: #8a857a; --accent: #d9632b; --accent-soft: #fbe3d6;
    --sel: #2b7bd9; --stage: #fbfaf6;
    font: 13px/1.4 system-ui, -apple-system, sans-serif; color: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1f26; --panel: #262932; --line: #3a3e4a; --ink: #e9e6de; --dim: #9a978f; --accent: #f08a4b; --accent-soft: #4a3326; --sel: #6aa8f0; --stage: #2a2d36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  select, button, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.45; cursor: default; }
  select, input[type=number], input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; }
  input[type=number] { width: 62px; }
  #status { color: var(--dim); margin-left: auto; }
  #status.dirty { color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #stageWrap { padding: 8px; }
  #stage { display: block; width: 100%; max-width: calc(62vh * 50 / 31); margin: 0 auto; image-rendering: pixelated; cursor: crosshair; touch-action: none; border-radius: 4px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 4px; color: var(--dim); }
  .bar label { display: flex; gap: 4px; align-items: center; }
  aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  #parts { max-height: 46vh; overflow: auto; padding: 4px 0; }
  .group { padding: 6px 10px 2px; display: flex; align-items: center; justify-content: space-between; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .group button { padding: 0 6px; font-size: 11px; text-transform: none; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 10px; cursor: pointer; }
  .row:hover { background: var(--bg); }
  .row.on { background: var(--accent-soft); }
  .row .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); flex: none; }
  .row .what { color: var(--dim); margin-left: auto; font-size: 11px; }
  #inspector { padding: 10px; }
  #inspector h2 { font-size: 13px; margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
  #inspector h2 .acts { margin-left: auto; display: flex; gap: 4px; }
  #inspector h2 .acts button { padding: 1px 7px; }
  .field { display: grid; grid-template-columns: 78px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
  .field > span { color: var(--dim); }
  .field .nums { display: flex; gap: 4px; flex-wrap: wrap; }
  .note { color: var(--dim); }
  #timeline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 4px 2px; border-top: 1px solid var(--line); }
  #timeline .frames { display: flex; gap: 4px; flex-wrap: wrap; }
  #timeline .frames button { padding: 2px; border-radius: 5px; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--dim); }
  #timeline .frames button.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); color: var(--ink); }
  #timeline .frames canvas { display: block; width: 84px; height: 52px; image-rendering: pixelated; border-radius: 3px; }
  #timeline input[type=range] { width: min(420px, 60vw); }
  #timeline .note { flex-basis: 100%; }
  .field.own > span:first-child { color: var(--accent); }
  #previewCard { grid-column: 1 / -1; padding: 8px; }
  #preview { display: block; width: 100%; image-rendering: pixelated; border-radius: 4px; }
  #sprites { display: flex; gap: 14px; align-items: flex-end; padding: 8px 10px; }
  #sprites canvas { image-rendering: pixelated; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Animal Workshop</h1>
  <select id="kind" aria-label="Animal"></select>
  <button id="undo" title="Undo (⌘Z)">Undo</button>
  <button id="redo" title="Redo (⇧⌘Z)">Redo</button>
  <button id="revert" title="Back to the file as it was loaded">Revert</button>
  <button id="save" class="primary" title="Save into animals/… or its asset, assets/… (⌘S)">Save</button>
  <span id="status"></span>
</header>
<main>
  <section class="card" id="stageWrap">
    <canvas id="stage"></canvas>
    <div class="bar">
      <label>Move <select id="move"></select></label>
      <button id="play" title="Play the move (Space)">▶ Play</button>
      <label title="The frames before (blue) and after (orange), faded"><input id="onion" type="checkbox" checked> Onion skin</label>
      <label><input id="allHandles" type="checkbox" checked> All handles</label>
      <span id="hint">Drag the handles. Click a shape to pick it. Shift: half pixels.</span>
    </div>
    <div id="timeline"></div>
  </section>
  <aside>
    <div class="card"><div id="parts"></div></div>
    <div class="card" id="inspector"></div>
    <div class="card" id="sprites"></div>
  </aside>
  <section class="card" id="previewCard">
    <canvas id="preview"></canvas>
    <div class="bar">
      <label>Move <select id="act"><option>run</option><option>jump</option><option>duck</option><option>idle</option><option>hurt</option><option>ko</option></select></label>
      <label>Light <select id="light"><option>day</option><option>night</option><option>golden</option></select></label>
      <label><input id="giant" type="checkbox"> Giant</label>
      <label>Speed <input id="speed" type="range" min="0" max="300" value="150"></label>
    </div>
  </section>
</main>
<script type="module" src="workshop.js"></script>
</body>
</html>
