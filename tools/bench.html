<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lop Hop Bench</title>
<link rel="icon" href="../icons/favicon.png">
<style>
  :root { --bg: #f7f6f0; --panel: rgba(255, 253, 248, 0.92); --line: #ddd8cc; --ink: #2f2d29; --dim: #8a857a; --accent: #d9632b; font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1f26; --panel: rgba(38, 41, 50, 0.92); --line: #3a3e4a; --ink: #e9e6de; --dim: #9a978f; --accent: #f08a4b; }
  }
  :root[data-theme="dark"] { --bg: #1d1f26; --panel: rgba(38, 41, 50, 0.92); --line: #3a3e4a; --ink: #e9e6de; --dim: #9a978f; --accent: #f08a4b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #panel { position: fixed; left: 8px; top: 8px; max-width: calc(100vw - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; z-index: 2;
    -webkit-user-select: none; user-select: none; }
  #panel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  #panel .row:last-child { margin-bottom: 0; }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; touch-action: manipulation; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #stats { font-weight: 600; font-variant-numeric: tabular-nums; }
  #note { color: var(--dim); }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 1px 8px 1px 0; text-align: right; }
  th { color: var(--dim); font-weight: normal; }
  td:first-child, th:first-child { text-align: left; }
  #panel.folded .more { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="back"></canvas><canvas id="parts"></canvas><canvas id="mesh"></canvas></div>
<div id="panel">
  <div class="row"><button id="fold">–</button><span id="stats">…</span></div>
  <div class="more">
    <div class="row" id="modes"></div>
    <div class="row">animals <button data-n="0.5">÷2</button><span id="n"></span><button data-n="2">×2</button> <button id="all">Run all</button></div>
    <div class="row" id="note"></div>
    <div class="row"><table id="results"></table></div>
  </div>
</div>
<script type="module" src="bench.js"></script>
</body>
</html>
