<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font</title>
<link rel="icon" href="../icons/favicon.png">
<style>
  :root {
    --bg: #f4f2ec; --panel: #fffdf8; --line: #ddd8cc; --ink: #2f2d29; --dim: #8a857a; --accent: #d9632b; --bad: #d6455f;
    font: 13px/1.4 system-ui, -apple-system, sans-serif; color: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1f26; --panel: #262932; --line: #3a3e4a; --ink: #e9e6de; --dim: #9a978f; --accent: #f08a4b; --bad: #e8607e; }
  }
  :root[data-theme="dark"] { --bg: #1d1f26; --panel: #262932; --line: #3a3e4a; --ink: #e9e6de; --dim: #9a978f; --accent: #f08a4b; --bad: #e8607e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); }
  header { display: flex; gap: 10px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header label { display: flex; gap: 5px; align-items: center; color: var(--dim); }
  input, select { font: inherit; color: inherit; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; }
  input[type=text] { width: min(420px, 100%); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
  main { padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
  h2 { font-size: 13px; margin: 0 0 8px; }
  .note { color: var(--dim); margin: 0 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
  canvas { display: block; image-rendering: pixelated; }
  .previews { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; overflow-x: auto; }
  .previews h3 { font-size: 11px; margin: 0; color: var(--dim); font-weight: 600; }
  #missing { color: var(--bad); min-height: 1.4em; margin: 6px 0 0; }
  .glyphs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .glyphs figure { margin: 0; padding: 8px 4px 4px; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .glyphs canvas { flex: none; }
  figcaption { color: var(--dim); font-size: 11px; text-align: center; font-variant-numeric: tabular-nums; }
  figcaption b { color: var(--ink); font-size: 13px; }
</style>
</head>
<body>
<header>
  <label>size <input id="size" type="range" min="1" max="12" step="1" value="6"> <span id="sizeout"></span></label>
  <label>grid <input id="grid" type="checkbox"></label>
</header>
<main>
  <section class="card">
    <h2>Try it</h2>
    <p class="note">As the game writes it: in capitals, a pixel between letters. A letter the font lacks is drawn as a space.</p>
    <input id="text" type="text" value="LOP HOP! GROSSE SPRÜNGE ÄÖÜ $4.99 4,99 €" spellcheck="false">
    <div class="previews"><canvas id="preview"></canvas></div>
    <p id="missing"></p>
  </section>
  <section class="card">
    <h2 id="count">Every letter</h2>
    <div class="glyphs" id="glyphs"></div>
  </section>
</main>
<script type="module">
import { GLYPHS, ABOVE, BELOW, text, textWidth } from '../font.js';

const $ = (id) => document.getElementById(id);
const ink = () => getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
const accent = () => getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
const line = () => getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
const dpr = () => window.devicePixelRatio || 1;

// a canvas w × h pixels of the font at size, sharp on the screen, with the font's pixel grid under it if asked
function canvasFor(c, w, h, size) {
  const k = dpr();
  c.width = Math.round(w * size * k); c.height = Math.round(h * size * k);
  c.style.width = `${w * size}px`; c.style.height = `${h * size}px`;
  const ctx = c.getContext('2d');
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, w * size, h * size);
  if ($('grid').checked && size >= 3) {
    ctx.fillStyle = line();
    for (let x = 0; x <= w; x++) ctx.fillRect(x * size, 0, 1 / k, h * size);
    for (let y = 0; y <= h; y++) ctx.fillRect(0, y * size, w * size, 1 / k);
  }
  return ctx;
}

// s drawn into canvas c: a pixel of space around its cell; with the grid, the letters' 5 rows marked off from the
// rows above and below
function draw1(c, s, size) {
  const w = Math.max(1, textWidth(s)) + 2, ctx = canvasFor(c, w, ABOVE + 5 + BELOW + 2, size);
  if ($('grid').checked && size >= 3) {
    ctx.fillStyle = accent();
    for (const y of [ABOVE + 1, ABOVE + 6]) ctx.fillRect(0, y * size - 0.5, w * size, 1);
  }
  text(ctx, s, size, (ABOVE + 1) * size, ink(), 'left', size);
}

function preview() {
  const size = +$('size').value, s = $('text').value;
  draw1($('preview'), s, size);
  const lacks = [...new Set([...s.toUpperCase()].filter((ch) => !GLYPHS[ch]))];
  $('missing').textContent = lacks.length ? `not in the font: ${lacks.map((ch) => JSON.stringify(ch)).join(' ')}` : '';
}

function all() {
  const size = +$('size').value, box = $('glyphs');
  box.textContent = '';
  const chars = Object.keys(GLYPHS);
  $('count').textContent = `Every letter (${chars.length})`;
  for (const ch of chars) {
    const fig = document.createElement('figure'), c = document.createElement('canvas'), cap = document.createElement('figcaption');
    draw1(c, ch, size);
    cap.innerHTML = `<b></b><br>${textWidth(ch)} wide`;
    cap.firstChild.textContent = ch === ' ' ? 'space' : ch;
    fig.title = `'${ch}': ${GLYPHS[ch]}`;
    fig.append(c, cap);
    box.append(fig);
  }
}

function draw() {
  $('sizeout').textContent = `×${$('size').value}`;
  preview();
  all();
}
$('size').addEventListener('input', draw);
$('grid').addEventListener('change', draw);
$('text').addEventListener('input', preview);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
draw();
</script>
<script type="module" src="../tools/nav.js"></script>
</body>
</html>
